$kind: http-request
name: TC-09 POST /transactions negatief bedrag
url: "{{baseUrl}}/transactions"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{cemId}}"
body:
  type: text
  content: |-
    {
      "fromAccountId": "{{cemId}}",
      "toAccountId": "{{sophieId}}",
      "currency": "EUR",
      "amount": -100,
      "description": "Dit is een overboek bericht"
    }
scripts:
  - type: afterResponse
    code: pm.test("400 Bad Request", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 9000
