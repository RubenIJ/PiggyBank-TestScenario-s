$kind: http-request
name: TC-18 POST /transactions met script in omschrijving
url: "{{baseUrl}}/transactions"
method: POST
headers:
  Content-Type: application/json
  X-User-Id: "{{cemId}}"
body:
  type: text
  content: |-
    {
      "fromAccountId": "{{cemId}}",
      "toAccountId": "{{sophieId}}",
      "currency": "EUR",
      "amount": 1,
      "description": "<script>alert(1)</script>"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK of 201 Created", function () { pm.expect([200, 201]).to.include(pm.response.code); });
      pm.test("Response bevat geen uitvoerbare script", function () { pm.expect(pm.response.text()).to.not.include("<script>alert(1)</script>"); });
    language: text/javascript
order: 18000
