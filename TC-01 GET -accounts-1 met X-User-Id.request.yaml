$kind: http-request
name: TC-01 GET /accounts/1 met X-User-Id
url: "{{baseUrl}}/accounts/1"
method: GET
headers:
  X-User-Id: "{{melvinId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Bevat id, name en balance", function () {
          const j = pm.response.json();
          pm.expect(j).to.have.property("id");
          pm.expect(j).to.have.property("name");
          pm.expect(j).to.have.property("balance");
      });
    language: text/javascript
order: 1000
